<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="form-box login" style="width:100%; right:0;">

            <form action="#">

                <h1 class="form-title">
                    <i class="fa-solid fa-key"></i>
                    <span>Reset Password</span>
                </h1>

                <p>Masukkan username atau email Anda</p>

                <!-- Username -->
                <div class="input-box">
                    <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required>

                    <i class="fa-solid fa-user"></i>
                </div>

                <!-- Email -->
                <div class="input-box">
                    <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required>

                    <i class="fa-solid fa-envelope"></i>
                </div>

               <button
                type="button"
                class="btn"
                onclick="checkAccount()">

                    <i class="fa-solid fa-paper-plane"></i>
                    Kirim Reset Link

                </button>

                <p id="error-message"></p>

                <div class="forgot-link" style="margin-top:20px;">
                    <a href="login.html">
                        ← Kembali ke Login
                    </a>
                </div>

            </form>

        </div>

    </div>
        <script>

        let attempts = 0;

        function checkAccount(){

            const username =
            document.getElementById("username").value;

            const email =
            document.getElementById("email").value;

            // contoh data sementara
            const correctUsername = "admin";
            const correctEmail = "admin@gmail.com";

            if(
                username === correctUsername &&
                email === correctEmail
            ){

                // pindah ke halaman reset password
                window.location.href =
                "forgot-password.html";

            } else {

                attempts++;

                document.getElementById("error-message")
                .innerHTML =
                "Username atau Email salah!";

                if(attempts >= 5){

                    document.getElementById("error-message")
                    .innerHTML =
                    `
                    Terlalu banyak percobaan gagal.<br>
                    Harap hubungi admin
                    <a href="#">
                    klik link berikut
                    </a>
                    `;
                }
            }
        }

        </script>
</body>
</html>
