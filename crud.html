<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Manajemen Users</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700&display=swap');

        * {
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            list-style: none;
        }

        body {
            background: linear-gradient(135deg, #fff8dc, #ffe082);
            min-height: 100vh;
            padding: 20px;
        }

        /* Container */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .dashboard-header {
            background: white;
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo-area h1 {
            font-size: 24px;
            color: #d97706;
        }

        .logo-area h1 i {
            margin-right: 10px;
        }

        .logo-area p {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.3);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-info h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }

        .stat-info .number {
            font-size: 32px;
            font-weight: 700;
            color: #d97706;
        }

        .stat-icon i {
            font-size: 48px;
            color: #facc15;
        }

        /* Content Card */
        .content-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f3d28b;
        }

        .card-header h2 {
            color: #333;
            font-size: 22px;
        }

        .card-header h2 i {
            color: #d97706;
            margin-right: 10px;
        }

        .add-btn {
            background: linear-gradient(135deg, #d97706, #facc15);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(217, 119, 6, 0.3);
        }

        /* Search Box */
        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            max-width: 350px;
            padding: 12px 20px;
            border: 1px solid #f3d28b;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #facc15, #d97706);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f3d28b;
            color: #333;
            font-size: 14px;
        }

        tr:hover {
            background: #fff7e6;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .edit-btn, .delete-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .edit-btn {
            background: #3b82f6;
            color: white;
        }

        .edit-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3d28b;
        }

        .modal-header h3 {
            color: #333;
            font-size: 22px;
        }

        .modal-header h3 i {
            color: #d97706;
            margin-right: 10px;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #888;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #d97706;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group label i {
            color: #d97706;
            margin-right: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #f3d28b;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .save-btn, .cancel-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .save-btn {
            background: linear-gradient(135deg, #d97706, #facc15);
            color: white;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(217, 119, 6, 0.3);
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #333;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .empty-state i {
            font-size: 64px;
            color: #facc15;
            margin-bottom: 20px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .dashboard-header {
                padding: 15px 20px;
            }

            .logo-area h1 {
                font-size: 20px;
            }

            .content-card {
                padding: 20px;
            }

            .card-header h2 {
                font-size: 18px;
            }

            th, td {
                padding: 10px;
                font-size: 12px;
            }

            .action-buttons {
                flex-direction: column;
                gap: 5px;
            }

            .edit-btn, .delete-btn {
                padding: 4px 8px;
                font-size: 10px;
            }

            .stat-info .number {
                font-size: 24px;
            }

            .stat-icon i {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }

            .modal-header h3 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <div class="logo-area">
                <h1>
                    <i class="fa-solid fa-microchip"></i>
                    IoT Kandang Cerdas
                </h1>
                <p>Manajemen & Monitoring Ayam Modern</p>
            </div>
            <a href="http://goldenchick.my.id/admin">
                <button class="logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Keluar
            </button>
            </a>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h3><i class="fa-solid fa-users"></i> Total Pengguna</h3>
                    <div class="number" id="totalUsers">0</div>
                </div>
                <div class="stat-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3><i class="fa-solid fa-farm"></i> Total Peternakan</h3>
                    <div class="number" id="totalFarms">0</div>
                </div>
                <div class="stat-icon">
                    <i class="fa-solid fa-tractor"></i>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3><i class="fa-solid fa-chicken"></i> Aktif</h3>
                    <div class="number" id="totalActive">0</div>
                </div>
                <div class="stat-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-card">
            <div class="card-header">
                <h2>
                    <i class="fa-solid fa-users-gear"></i>
                    Manajemen Pengguna
                </h2>
                <button class="add-btn" onclick="openAddModal()">
                    <i class="fa-solid fa-user-plus"></i>
                    Tambah Pengguna
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari username, email, atau nama peternakan..." onkeyup="searchUsers()">
            </div>

            <div class="table-responsive">
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Nama Peternakan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr class="empty-state">
                            <td colspan="5">
                                <i class="fa-solid fa-users-slash"></i>
                                <p>Belum ada data pengguna</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Tambah/Edit -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">
                    <i class="fa-solid fa-user-plus"></i>
                    Tambah Pengguna
                </h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="userForm" onsubmit="saveUser(event)">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label><i class="fa-solid fa-user-tag"></i> Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="email" placeholder="Masukkan email" required>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-tractor"></i> Nama Peternakan</label>
                    <input type="text" id="farmName" placeholder="Masukkan nama peternakan" required>
                </div>
                <div class="form-group" id="passwordGroup">
                    <label><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Masukkan password (minimal 6 karakter)" minlength="6">
                    <small style="color: #888; font-size: 11px;">*Kosongkan jika tidak ingin mengubah password (untuk edit)</small>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="save-btn">
                        <i class="fa-solid fa-save"></i> Simpan
                    </button>
                    <button type="button" class="cancel-btn" onclick="closeModal()">
                        <i class="fa-solid fa-times"></i> Batal
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data users (simulasi localStorage)
        let users = [];

        // Load data dari localStorage
        function loadData() {
            const storedUsers = localStorage.getItem('users');
            if (storedUsers) {
                users = JSON.parse(storedUsers);
            } else {
                // Data dummy
                users = [
                    { id: 1, username: 'admin', email: 'admin@iotkandang.com', farmName: 'Peternakan Makmur', password: '123456' },
                    { id: 2, username: 'peternak1', email: 'peternak1@gmail.com', farmName: 'Ayam Sejahtera', password: '123456' },
                    { id: 3, username: 'peternak2', email: 'peternak2@gmail.com', farmName: 'Golden Farm', password: '123456' }
                ];
                saveToLocalStorage();
            }
            renderTable();
            updateStats();
        }

        // Simpan ke localStorage
        function saveToLocalStorage() {
            localStorage.setItem('users', JSON.stringify(users));
        }

        // Render tabel
        function renderTable() {
            const tbody = document.getElementById('userTableBody');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredUsers = users.filter(user => 
                user.username.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm) ||
                user.farmName.toLowerCase().includes(searchTerm)
            );

            if (filteredUsers.length === 0) {
                tbody.innerHTML = `
                    <tr class="empty-state">
                        <td colspan="5">
                            <i class="fa-solid fa-users-slash"></i>
                            <p>${searchTerm ? 'Data tidak ditemukan' : 'Belum ada data pengguna'}</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filteredUsers.map((user, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><i class="fa-solid fa-user"></i> ${escapeHtml(user.username)}</td>
                    <td><i class="fa-solid fa-envelope"></i> ${escapeHtml(user.email)}</td>
                    <td><i class="fa-solid fa-tractor"></i> ${escapeHtml(user.farmName)}</td>
                    <td class="action-buttons">
                        <button class="edit-btn" onclick="editUser(${user.id})">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <button class="delete-btn" onclick="deleteUser(${user.id})">
                            <i class="fa-solid fa-trash"></i> Hapus
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Update statistik
        function updateStats() {
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalFarms').textContent = users.length;
            document.getElementById('totalActive').textContent = users.length;
        }

        // Search
        function searchUsers() {
            renderTable();
        }

        // Open modal untuk tambah
        function openAddModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-plus"></i> Tambah Pengguna';
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('password').required = true;
            document.getElementById('userModal').classList.add('show');
        }

        // Edit user
        function editUser(id) {
            const user = users.find(u => u.id === id);
            if (user) {
                document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-pen"></i> Edit Pengguna';
                document.getElementById('userId').value = user.id;
                document.getElementById('username').value = user.username;
                document.getElementById('email').value = user.email;
                document.getElementById('farmName').value = user.farmName;
                document.getElementById('password').value = '';
                document.getElementById('password').required = false;
                document.getElementById('passwordGroup').style.display = 'block';
                document.getElementById('userModal').classList.add('show');
            }
        }

        // Save user
        function saveUser(event) {
            event.preventDefault();
            
            const id = document.getElementById('userId').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const farmName = document.getElementById('farmName').value;
            const password = document.getElementById('password').value;

            if (id) {
                // Edit
                const index = users.findIndex(u => u.id == id);
                if (index !== -1) {
                    users[index].username = username;
                    users[index].email = email;
                    users[index].farmName = farmName;
                    if (password) {
                        users[index].password = password;
                    }
                    showNotification('Data berhasil diupdate!', 'success');
                }
            } else {
                // Tambah baru
                const newId = users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 1;
                users.push({
                    id: newId,
                    username,
                    email,
                    farmName,
                    password
                });
                showNotification('Data berhasil ditambahkan!', 'success');
            }
            
            saveToLocalStorage();
            renderTable();
            updateStats();
            closeModal();
        }

        // Delete user
        function deleteUser(id) {
            if (confirm('Yakin ingin menghapus pengguna ini?')) {
                users = users.filter(u => u.id !== id);
                saveToLocalStorage();
                renderTable();
                updateStats();
                showNotification('Data berhasil dihapus!', 'success');
            }
        }

        // Close modal
        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
            document.getElementById('userForm').reset();
        }

        // Logout
        function handleLogout() {
            if (confirm('Yakin ingin keluar?')) {
                localStorage.removeItem('isLoggedIn');
                window.location.href = 'login.html';
            }
        }

        // Notification
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? '#10b981' : '#ef4444'};
                color: white;
                padding: 15px 25px;
                border-radius: 10px;
                z-index: 2000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            `;
            notification.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Tutup modal klik di luar
        window.onclick = function(event) {
            const modal = document.getElementById('userModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Inisialisasi
        loadData();
    </script>
</body>
</html>
